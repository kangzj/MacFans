name: Fanwright
options:
  bundleIdPrefix: com.jasperkang
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
packages:
  FanwrightKit:
    path: Packages/FanwrightKit
targets:
  FanwrightHelper:
    type: tool
    platform: macOS
    sources:
      - Helper
      - Shared
    dependencies:
      - package: FanwrightKit
        product: SMCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasperkang.fanwright.helper
        INFOPLIST_FILE: Helper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
  Fanwright:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - package: FanwrightKit
        product: SMCKit
      - package: FanwrightKit
        product: FanwrightCore
      - target: FanwrightHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasperkang.fanwright
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Fanwright.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    postBuildScripts:
      - name: Embed launchd plist
        script: |
          mkdir -p "$CODESIGNING_FOLDER_PATH/Contents/Library/LaunchDaemons"
          cp "$SRCROOT/Helper/com.jasperkang.fanwright.helper.plist" "$CODESIGNING_FOLDER_PATH/Contents/Library/LaunchDaemons/"
        outputFiles:
          - $(CODESIGNING_FOLDER_PATH)/Contents/Library/LaunchDaemons/com.jasperkang.fanwright.helper.plist
schemes:
  Fanwright:
    build:
      targets:
        Fanwright: all
    run:
      config: Debug
